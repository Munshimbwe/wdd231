<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100" height="100">
    <style>
        .favicon-bg {
            fill: #4f46e5;
        }
        .favicon-symbol {
            fill: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            .favicon-bg {
                fill: #ffffff;
            }
            .favicon-symbol {
                fill: #0f172a;
            }
        }
    </style>
    <rect width="100" height="100" rx="20" class="favicon-bg"/>
    <text x="50" y="65" font-family="system-ui, sans-serif" font-size="50" font-weight="bold" text-anchor="middle" class="favicon-symbol">K</text>
</svg>
